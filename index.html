<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hermes MC" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const theme = localStorage.getItem('mission-control-theme') || 'system';
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = theme === 'dark' || theme === 'light' ? theme : (prefersDark ? 'dark' : 'light');

          // The page canvas is painted by the stylesheet rules keyed on this
          // attribute (see the inline <style> below). Setting the attribute
          // before first paint is what avoids a flash; writing the background
          // inline here would instead pin it, so a later theme switch could no
          // longer repaint the canvas.
          root.setAttribute('data-theme', resolved);

          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', resolved === 'dark' ? '#0f1117' : '#ffffff');
          }
        } catch {}
      })();
    </script>
    <title>Hermes Mission Control</title>
    <meta
      name="description"
      content="Mobile-first Mission Control for Hermes: status, sessions, alerts, and quick actions in one view."
    />
    <style>
      :root { color-scheme: dark light; }
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #0f1117;
      }
      body { background: inherit; }
      #root { background: inherit; }
      @media (prefers-color-scheme: light) {
        html, body, #root { background: #ffffff; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body, html[data-theme='dark'] #root { background: #0f1117; }
      html[data-theme='light'], html[data-theme='light'] body, html[data-theme='light'] #root { background: #ffffff; }
      /* Both the canvas and the native widget scheme follow the attribute, so a
         runtime theme switch repaints scrollbars and form controls too. */
      html[data-theme='dark'] { color-scheme: dark; }
      html[data-theme='light'] { color-scheme: light; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0f1117;
      }
      html[data-theme='light'] #boot-splash { background: #ffffff; }
      #boot-splash .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(139, 92, 246, 0.25);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-splash .boot-word {
        color: #9ca3af;
        font: 600 0.78rem -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.04em;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="boot-spinner"></div>
        <div class="boot-word">Hermes Mission Control</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
